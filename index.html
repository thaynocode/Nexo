d-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}.level{background:#141d33;border:1px solid var(--line);padding:24px;border-radius:20px}.level.locked{opacity:.5}.level h3{margin:8px 0}.level p{min-height:56px;font-size:14px}.level .primary{width:100%;margin-top:12px}.quizwrap{max-width:760px;margin:auto}.question{white-space:pre-line;font-size:clamp(23px,3vw,33px);line-height:1.3;margin:25px 0}.answers{display:grid;gap:12px}.answer{display:flex;gap:15px;align-items:center;background:#151f36;border:1px solid #35405e;border-radius:16px;color:var(--text);padding:17px;text-align:left;min-height:67px}.answer b{border-radius:10px;background:#2b3550;padding:9px 13px;color:#d7cbff}.answer:hover:not(:disabled){border-color:#b8a5ff}.answer:disabled{cursor:default}.answer.correct{background:#153b37;border-color:#51d4a9}.answer.wrong{background:#40232f;border-color:#ff8da0}.feedback{border-radius:18px;background:#202b44;padding:20px;margin-top:18px;border:1px solid #475372}.feedback strong{color:#b4f1d6}.feedback.bad strong{color:#ffb1be}.end{text-align:center;max-width:680px;margin:30px auto}.medal{font-size:70px}.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.chartrow{margin:15px 0}.chartrow .statline{font-size:14px}.chip{display:inline-flex;background:#262343;border:1px solid #554a88;border-radius:99px;padding:6px 10px;font-size:12px;color:#e5dbff}.empty{padding:30px;text-align:center;color:var(--muted)}.foot{margin-top:45px;border-top:1px solid var(--line);padding-top:20px;color:#7f8ca9;font-size:12px}.search{background:#111a2e;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:200px}.review{border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}.review strong{display:block;margin-bottom:7px}@media(max-width:850px){.hero{grid-template-columns:1fr}.subject-grid{grid-template-columns:repeat(2,1fr)}.topic-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.shell{padding:17px 15p <style>

<script>
const NexoCloud=(()=>{
 const config=window.NEXO_SUPABASE;const configured=()=>/^https:\/\/[\w-]+\.supabase\.co\/?$/.test(config.url)&&config.anonKey.length>25;
 let session=null, status='local',timer=null,busy=false,dirty=false;
 const tokenKey='nexo6-auth-v1';const ownerKey='nexo6-progress-owner';
 const base=()=>config.url.replace(/\/$/,'');
 const headers=(token)=>({'apikey':config.anonKey,'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})});
 async function req(path,method='GET',data=null,token=null){let r=await fetch(base()+path,{method,headers:headers(token),body:data===null?undefined:JSON.stringify(data)});let raw=await r.text(),v;try{v=raw?JSON.parse(raw):{}}catch{v={message:raw}}if(!r.ok)throw Error(v.msg||v.message||v.error_description||v.error||('Erro '+r.status));return v}
 function setSession(v){
  const previous=session?.user?.id||localStorage.getItem(ownerKey);
  const next=v?.user?.id||null;
  if(next&&previous&&previous!==next){state={scores:{},attempts:{},mistakes:{},xp:0};localStorage.setItem(key,JSON.stringify(state))}
  if(next)localStorage.setItem(ownerKey,next);
  session=v;
  try{session?localStorage.setItem(tokenKey,JSON.stringify(session)):localStorage.removeItem(tokenKey)}catch{}
  status=session?'online':'local';updateBar()
 }
 function updateBar(){let bar=document.getElementById('nexo-cloudbar');if(!bar)return;let label=!configured()?'Nuvem aguardando configuração':status==='online'?'Progresso na nuvem • '+(session?.user?.email||'conectado'):status==='sync'?'Sincronizando progresso…':status==='error'?'Sem conexão • progresso salvo no aparelho':'Progresso salvo neste aparelho';bar.innerHTML='<span class="clouddot '+(status==='online'?'online':'')+'"></span><span>'+label.replace(/[&<>]/g,'')+'</span><button class="ghost" onclick="NexoCloud.open()">'+(session?'Minha conta':'Entrar / Criar conta')+'</button>'}
 async function validToken(){if(!session)return null;if(session.expires_at && Date.now()/1000>session.expires_at-60){let v=await req('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});setSession({...v,expires_at:Math.floor(Date.now()/1000)+v.expires_in})}return session.access_token}
 function merge(local,remote){let out={scores:{},attempts:{},mistakes:{},xp:0};for(let k of new Set([...Object.keys(local.scores||{}),...Object.keys(remote.scores||{})]))out.scores[k]=Math.max(local.scores?.[k]||0,remote.scores?.[k]||0);for(let k of new Set([...Object.keys(local.attempts||{}),...Object.keys(remote.attempts||{})])){let la=local.attempts?.[k]||0,ra=remote.attempts?.[k]||0;out.attempts[k]=Math.max(la,ra);out.mistakes[k]=(la>=ra?local.mistakes?.[k]:remote.mistakes?.[k])||[]}out.xp=Math.max(local.xp||0,remote.xp||0);return out}
 // REST upsert requires Prefer header; this function replaces the initial generic request for writes.
 async function upsert(){if(!session||!configured()){return}if(busy){dirty=true;return}busy=true;dirty=false;status='sync';updateBar();try{let token=await validToken(),id=session.user.id;let r=await fetch(base()+'/rest/v1/learning_progress?on_conflict=user_id',{method:'POST',headers:{...headers(token),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:id,progress:state,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(await r.text());status='online'}catch(e){console.warn(e);status='error'}finally{busy=false;updateBar();if(dirty){dirty=false;queue()}}}
 async function syncFull(){if(!configured()||!session||busy)return;busy=true;status='sync';updateBar();try{let token=await validToken(),id=session.user.id;let result=await req('/rest/v1/learning_progress?select=progress&user_id=eq.'+encodeURIComponent(id),'GET',null,token);state=merge(state,result[0]?.progress||{});localStorage.setItem(key,JSON.stringify(state));busy=false;await upsert();if(typeof render==='function')render()}catch(e){console.warn(e);status='error';busy=false;updateBar()}}
 async function clearCloud(){if(!session||!configured())return true;try{let token=await validToken();await req('/rest/v1/learning_progress?user_id=eq.'+encodeURIComponent(session.user.id),'DELETE',null,token);status='online';updateBar();return true}catch(e){status='error';console.warn(e);updateBar();return false}}
 function queue(){if(!session)return;dirty=true;clearTimeout(timer);timer=setTimeout(()=>upsert(),900)}
 function open(){let old=document.getElementById('nexo-cloudmodal');if(old)old.remove();let modal=document.createElement('div');modal.id='nexo-cloudmodal';modal.className='clouddialog';modal.innerHTML='<div class="cloudpanel" role="dialog" aria-modal="true" aria-label="Conta NEXO"><h2>☁️ Sua jornada, em qualquer dispositivo</h2><p>Entre com seu e-mail para sincronizar medalhas, níveis, erros e progresso.</p><div id="nexo-cloudmsg" class="error"></div>'+(session?'<p>Conectado como '+String(session.user.email||'').replace(/[&<>]/g,'')+'</p><button class="primary" id="cloud-sync">Sincronizar agora</button><button class="ghost" id="cloud-out">Sair da conta</button>':'<div class="oauth-options"><button class="oauth-button" data-oauth="google" type="button"><span class="oauth-mark">G</span> Continuar com Google</button><button class="oauth-button" data-oauth="azure" type="button"><span class="oauth-mark">▦</span> Continuar com Microsoft</button><button class="oauth-button" data-oauth="apple" type="button"><span class="oauth-mark">●</span> Continuar com Apple</button></div><div class="oauth-divider">ou use seu e-mail</div><label>E-mail<input id="cloud-email" type="email" autocomplete="email" placeholder="voce@exemplo.com"></label><label>Senha (mínimo 6 caracteres)<input id="cloud-pass" type="password" autocomplete="current-password" placeholder="••••••••"></label><button class="primary" id="cloud-in">Entrar</button><button class="ghost" id="cloud-signup">Criar conta</button>')+'<button class="ghost" id="cloud-close" style="float:right">Fechar</button></div>';document.body.appendChild(modal);modal.querySelector('#cloud-close').onclick=()=>modal.remove();modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});let msg=modal.querySelector('#nexo-cloudmsg');if(!configured())msg.textContent='Configure a URL e a chave pública do Supabase no início do HTML para ativar a nuvem.';if(session){modal.querySelector('#cloud-sync').onclick=async()=>{await syncFull();msg.textContent=status==='online'?'Sincronizado.':'Não foi possível sincronizar.'};modal.querySelector('#cloud-out').onclick=()=>{clearTimeout(timer);setSession(null);state={scores:{},attempts:{},mistakes:{},xp:0};localStorage.setItem(key,JSON.stringify(state));localStorage.removeItem(ownerKey);modal.remove();render()}}else{modal.querySelectorAll('[data-oauth]').forEach(b=>b.onclick=()=>oauth(b.dataset.oauth));const oauthError=sessionStorage.getItem('nexo6-oauth-error');if(oauthError){msg.textContent='Não foi possível entrar: '+oauthError;sessionStorage.removeItem('nexo6-oauth-error')}let submit=async(signup)=>{if(!configured())return;let email=modal.querySelector('#cloud-email').value.trim(),password=modal.querySelector('#cloud-pass').value;msg.textContent='Aguarde…';try{if(password.length<6)throw Error('A senha precisa ter pelo menos 6 caracteres.');let v=await req(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password','POST',{email,password});if(v.access_token){setSession({...v,expires_at:Math.floor(Date.now()/1000)+v.expires_in});modal.remove();await syncFull()}else msg.textContent='Conta criada. Confirme seu e-mail e depois entre.'}catch(e){msg.textContent=e.message}};modal.querySelector('#cloud-in').onclick=()=>submit(false);modal.querySelector('#cloud-signup').onclick=()=>submit(true)}}
 function oauth(provider){if(!configured())return;const redirect=location.origin+location.pathname;sessionStorage.setItem('nexo6-oauth-pending',provider);const u=new URL(base()+'/auth/v1/authorize');u.searchParams.set('provider',provider);u.searchParams.set('redirect_to',redirect);location.assign(u.toString())}
 async function init(){if(!configured()){updateBar();return}try{const hash=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);const err=hash.get('error_description')||query.get('error_description');if(err){sessionStorage.setItem('nexo6-oauth-error',err);history.replaceState(null,'',location.pathname);console.warn('OAuth:',err)}
 if(hash.get('access_token')&&hash.get('refresh_token')){const access_token=hash.get('access_token'),refresh_token=hash.get('refresh_token');const user=await req('/auth/v1/user','GET',null,access_token);setSession({access_token,refresh_token,token_type:'bearer',user,expires_at:Math.floor(Date.now()/1000)+Number(hash.get('expires_in')||3600)});history.replaceState(null,'',location.pathname);sessionStorage.removeItem('nexo6-oauth-pending');await syncFull();return}
 let old=JSON.parse(localStorage.getItem(tokenKey)||'null');if(old?.access_token){setSession(old);await syncFull()}}catch(e){console.warn(e);status='error'}updateBar()}
 return {init,open,updateBar,queue,syncFull,clearCloud,configured,oauth};
})();

function advancedChallenge(topic,level){
 const base=topic.questions||[];if(base.length<3)return base;
 const count=base.length;const output=[];
 for(let i=0;i<count;i++){
  const ids=level===1?[i,(i+1)%count]:[i,(i+1)%count,(i+2)%count];
  const items=ids.map(n=>base[n]);const correctTexts=items.map(q=>q.opts[q.answer]);
  const wrong=(q,offset)=>{const pool=q.opts.filter((_,j)=>j!==q.answer);return pool[offset%pool.length]||q.opts[q.answer]};
  const join=a=>a.map((v,j)=>(j+1)+'. '+v).join('  •  ');
  const choices=[correctTexts,...ids.map((_,j)=>items.map((q,k)=>k===j?wrong(q,i+j+k):correctTexts[k])),items.map((q,k)=>wrong(q,i+k))];
  const unique=[...new Set(choices.map(join))];if(unique.length<4)continue;
  const intro=level===1?'Situação-problema: compare os dois casos, aplique o conteúdo estudado e escolha a solução correta para ambos.':'Desafio de análise: avalie os três casos e identifique a alternativa que resolve todos corretamente.';
  output.push({q:intro+'\n'+items.map((q,j)=>(j+1)+') '+q.q).join('\n'),opts:unique.slice(0,4),answer:0,explanation:'Resolução das situações: '+items.map((q,j)=>(j+1)+') '+correctTexts[j]+'. '+(q.explanation||'')).join(' ')});
 }
 return output;
}
function start(l,review=false){lv=l;isReview=review;let topic=DATA[sIdx].topics[tIdx];let pool=(l>0?(topic.advanced&&topic.advanced[String(l)]&&topic.advanced[String(l)].length>=10?topic.advanced[String(l)]:advancedChallenge(topic,l)):topic.questions);if(l>0){const authored=window.NEXO_PREMIUM_BANK?.[sIdx]?.[tIdx*2+(l-1)];if(authored){pool=[authored,...pool.filter(q=>q.q!==authored.q)].slice(0,10)}}pool=pool.filter((q,i,all)=>q&&q.q&&Array.isArray(q.opts)&&q.opts.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4&&all.findIndex(x=>x.q===q.q)===i);let items=review?(state.mistakes[id(sIdx,tIdx,l)]||[]).map(item=>typeof item==='object'?item:pool[item]).filter(Boolean):pool;questions=shuffle(items.map(q=>{let sourceIndex=pool.indexOf(q);let choices=shuffle(q.opts.map((text,i)=>({text,correct:i===q.answer})));return {...q,sourceIndex,choices}}));idx=0;correct=0;selected=null;missed=[];navigate('quiz')}function quiz(){let q=questions[idx];if(!q)return `<div class="panel"><h2>Nenhuma questão para revisar</h2><button class="primary" onclick="navigate('topic')">Voltar</button></div>`;return `<div class="quizwrap"><button class="back" onclick="navigate('topic')">← Sair do desafio</button><div class="panel"><div class="statline"><span class="eyebrow">${isReview?'REVISÃO':'NÍVEL '+levelNames[lv]}</span><span class="chip">${idx+1} / ${questions.length}</span></div><div class="progress"><div style="width:${(idx+1)/questions.length*100}%"></div></div><h2 class="question">${esc(q.q)}</h2><div class="answers">${q.choices.map((o,i)=>`<button class="answer ${selected===null?'':o.correct?'correct':selected===i?'wrong':''}" ${selected!==null?'disabled':''} onclick="answer(${i})"><b>${'ABCD'[i]}</b><span>${esc(o.text)}</span></button>`).join('')}</div>${selected===null?'':`<div class="feedback ${q.choices[selected].correct?'':'bad'}"><strong>${q.choices[selected].correct?'✓ Boa! Você acertou.':'↗ Você está aprendendo.'}</strong><p>${esc(q.explanation)}</p><button class="primary" onclick="next()">${idx+1===questions.length?'Ver meu resultado':'Próxima pergunta →'}</button></div>`}</div></div>`}function answer(i){if(selected!==null)return;selected=i;if(questions[idx].choices[i].correct)correct++;else missed.push(questions[idx]);render()}function next(){idx++;selected=null;if(idx>=questions.length){finish();navigate('result')}else render()}function finish(){if(isReview)return;let k=id(sIdx,tIdx,lv);let previous=best(sIdx,tIdx,lv);state.scores[k]=Math.max(previous,correct);state.attempts[k]=(state.attempts[k]||0)+1;state.xp=(state.xp||0)+Math.max(0,correct-previous)*12;let base=DATA[sIdx].topics[tIdx].questions;state.mistakes[k]=missed.map(q=>q.sourceIndex).filter(i=>i>=0);save()}function result(){let pass=correct>=threshold[lv],m=medal(correct);return `<div class="end panel"><div class="medal">${m}</div><div class="eyebrow">DESAFIO CONCLUÍDO</div><h1>${correct} de ${questions.length} acertos</h1><p>${isReview?'Revisão concluída! Continue praticando para consolidar o conteúdo.':pass?'Excelente! Você avançou na sua jornada.':'Você está evoluindo. Revise os erros e tente novamente.'}</p><div class="progress"><div style="width:${correct/questions.length*100}%"></div></div><div class="flex" style="justify-content:center;margin-top:25px"><button class="primary" onclick="navigate('topic')">Voltar à trilha</button>${!isReview&&missed.length?`<button class="ghost" onclick="start(${lv},true)">Revisar ${missed.length} erro(s)</button>`:''}<button class="ghost" onclick="start(${lv})">Jogar novamente</button></div></div>`}function dashboard(){let weak=[];DATA.forEach((s,si)=>s.topics.forEach((t,ti)=>{for(let l=0;l<3;l++){let k=id(si,ti,l);if(state.attempts[k]&&best(si,ti,l)<threshold[l])weak.push({si,ti,name:t.name+' — '+levelNames[l],subject:s.name,score:best(si,ti,l)})}}));weak.sort((a,b)=>a.score-b.score);return `<button class="back" onclick="navigate('home')">← Início</button><div class="eyebrow">INTELIGÊNCIA DE APRENDIZAGEM</div><h1>Seu mapa de evolução</h1><p>Veja suas conquistas e descubra onde concentrar seus estudos.</p><div class="hero"><div class="panel"><h2>📈 Evolução por matéria</h2>${DATA.map((s,i)=>`<div class="chartrow"><div class="statline"><span>${icons[i]} ${esc(s.name)}</span><b>${countComplete(i)}/${s.topics.length}</b></div><div class="progress"><div style="width:${countComplete(i)/s.topics.length*100}%"></div></div></div>`).join('')}</div><div class="panel"><h2>🎯 Prioridades de reforço</h2>${weak.length?weak.slice(0,8).map(w=>`<div class="review"><strong>${esc(w.name)} <span style="color:#ffb3be">${w.score}/10</span></strong><small class="muted">${esc(w.subject)}</small><div style="margin-top:12px"><button class="ghost" onclick="sIdx=${w.si};tIdx=${w.ti};navigate('topic')">Praticar novamente →</button></div></div>`).join(''):`<div class="empty">${attempts()?'Nenhuma etapa abaixo da meta de aprovação. Continue evoluindo!':'Faça seu primeiro quiz para descobrir seus pontos de atenção.'}</div>`}</div></div><div class="panel" style="margin-top:20px"><h3>Seus dados</h3><p>O progresso é salvo no aparelho e pode ser sincronizado na sua conta Supabase.</p><div class="flex"><button class="ghost" onclick="exportProgress()">↓ Exportar relatório</button><button class="ghost" onclick="resetProgress()">Apagar meu progresso</button></div></div>`}function exportProgress(){let rows=['Matéria;Conteúdo;Nível;Melhor nota;Tentativas'];DATA.forEach((s,si)=>s.topics.forEach((t,ti)=>levelNames.forEach((n,l)=>rows.push([s.name,t.name,n,best(si,ti,l),state.attempts[id(si,ti,l)]||0].join(';')))));let blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nexo6-relatorio.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function resetProgress(){if(!confirm('Deseja apagar todas as conquistas e resultados, inclusive da nuvem?'))return;const removed=await NexoCloud.clearCloud();if(!removed){alert('Não foi possível apagar os dados na nuvem. Seu progresso foi preservado. Verifique a conexão e tente novamente.');return}state={scores:{},attempts:{},mistakes:{},xp:0};save();navigate('home')}render();NexoCloud.init();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(err=>console.warn('PWA offline indisponível:',err)))}</script></body></html>
