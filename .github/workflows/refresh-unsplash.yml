name: Atualizar fotografias Unsplash
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-unsplash.cjs --refresh
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: content/refresh-unsplash
          title: Atualizar fotografias de contexto do Unsplash
          commit-message: Atualizar metadados públicos do Unsplash
          body: Atualiza as fotos das lições e questionários, preservando créditos e URLs originais.
          add-paths: public/unsplash-photos.js
