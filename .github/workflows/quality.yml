name: Qualidade do conteúdo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar integração Unsplash
        run: node tests/unsplash.cjs
      - name: Validar exemplos visuais dos exercícios
        run: node tests/question-visuals.cjs
      - name: Validar aulas e ilustrações
        run: node scripts/validate-content.cjs
