name: Qualidade do conteúdo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar bancos e validar questionários de todos os anos
        run: |
          node curriculum/build.cjs
          git diff --exit-code -- public/grade-bank.js public/bncc-catalog.json public/bncc-mapping.csv
          node scripts/validate-grades.cjs
          node tests/grade-runtime.cjs
          node tests/question-quality.cjs
          node tests/bncc-content.cjs
